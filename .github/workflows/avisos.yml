name: Avisos del Sistema

"on":
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      hora:
        description: "Hora de Ecuador a probar (0-23). Vacío = la hora actual."
        required: false
        default: ""

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install web-push --no-save
      - env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
          HORA_MANUAL: ${{ github.event.inputs.hora }}
        run: node push.js
