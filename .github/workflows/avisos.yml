name: Avisos del Sistema

"on":
  schedule:
    - cron: "30 11 * * *"
    - cron: "0 19 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: "manana, tarde o noche"
        required: true
        default: "manana"

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install web-push --no-save
      - env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUB: ${{ secrets.PUSH_SUB }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
          TURNO_MANUAL: ${{ github.event.inputs.turno }}
          CRON: ${{ github.event.schedule }}
        run: node push.js
